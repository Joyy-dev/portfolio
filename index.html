<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>joyy-dev</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" href="assets/svg/joyy-dev-favicon.svg" type="image/svg+xml"/>
</head>

<body>
    <a class="visually-hidden skip-link" href="#main">Skip to main content</a>

    <header class="topnav" id="header">
        <div class="wrapper topnav__wrapper">
            <a href="/" class="topnav__home" aria-label="joyy-dev homepage">
                <img src="assets/svg/joyy-dev-logo.svg" alt="joyy-dev logo" class="topnav__logo" width="150" height="34">
            </a>

            <!-- Mobile menu toggle button (hamburger / close) -->
            <button class="topnav__toggle" 
                    type="button" 
                    aria-label="Open navigation menu" 
                    aria-expanded="false" 
                    aria-controls="primary-nav">
                <span class="topnav__hamburger" aria-hidden="true">
                    <span class="topnav__hamburger-line"></span>
                    <span class="topnav__hamburger-line"></span>
                    <span class="topnav__hamburger-line"></span>
                </span>
            </button>

            <!-- Responsive Navigation -->
            <nav class="topnav__nav" id="primary-nav" aria-label="Primary navigation">
                <ul class="topnav_links">
                    <li class="topnav__item">
                        <a href="#home" class="topnav__link topnav__link--active" aria-current="page">Home</a>
                    </li>
                    <li class="topnav__item">
                        <a href="#projects" class="topnav__link">Projects</a>
                    </li>
                    <li class="topnav__item">
                        <a href="#about" class="topnav__link">About</a>
                    </li>
                    <li class="topnav__item">
                        <a href="#blog" class="topnav__link">Blog</a>
                    </li>
                    <li class="topnav__item">
                        <a href="#contact" class="topnav__link">Contact</a>
                    </li>
                </ul>

                <div class="topnav__actions">
                    <a href="https://github.com/joyy-dev" target="_blank" rel="noopener noreferrer" class="topnav__cta">
                        Github
                    </a>
                </div>
            </nav>
        </div>

        <!-- Dimmed backdrop for mobile drawer -->
        <div class="topnav__backdrop" aria-hidden="true"></div>
    </header>

    <main id="main">
        <div class="wrapper">
            <h1>Mobile idea,<br>built with<br>purpose.</h1>
        </div>
    </main>

    <footer>
        <div class="wrapper">
            <!-- Footer content -->
        </div>
    </footer>
</body>
</html>
